name: Unzip uploaded archive

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unzip archive into extracted_tmp
        run: |
          set -e
          mkdir -p extracted_tmp
          for archive in *.zip; do
            if [ -f "$archive" ]; then
              unzip -o "$archive" -d extracted_tmp
            fi
          done
          shopt -s dotglob nullglob
          if [ -f extracted_tmp/README.md ] && [ -d extracted_tmp/src ]; then
            cp -a extracted_tmp/. ./
          else
            for dir in extracted_tmp/*/; do
              if [ -f "${dir}README.md" ] && [ -d "${dir}src" ]; then
                cp -a "${dir}." ./
              fi
            done
            for item in extracted_tmp/*; do
              if [ -f "$item" ]; then
                cp -a "$item" ./
              fi
            done
          fi
          rm -rf extracted_tmp
          if [ -f .github/workflows/ci.yml ]; then
            echo "--- BEGIN ci.yml ---"
            cat .github/workflows/ci.yml
            echo "--- END ci.yml ---"
            rm .github/workflows/ci.yml
          fi
          ls -la
      - name: Commit unzipped files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unzip uploaded archive into repo root"
            git push
          fi
